[workspace]
name = "multi-agent-shogun-node"
version = "0.1.0"
description = "Pixi environment for running the Shogun multi-agent system on Linux GPU nodes"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
"bash" = ">=5.2"
coreutils = "*"
curl = "*"
findutils = "*"
gawk = "*"
git = "*"
grep = "*"
nodejs = ">=22"
pip = "*"
"procps-ng" = "*"
python = "3.12.*"
pyyaml = ">=6"
sed = "*"
tmux = "*"
"util-linux" = "*"

[pypi-dependencies]
inotify-simple = ">=2,<3"

[tasks]
start = "bash start-shogun.sh"
start-shogun = "bash start-shogun.sh"
