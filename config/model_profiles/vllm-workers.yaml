# Route Ashigaru and Tanya to the separately hosted vLLM endpoint via Codex,
# and Metsuke to Codex gpt-6.1-sol so QC no longer draws on the Claude budget.
# Shogun, Karo and Gunshi inherit their commercial CLI/model settings from
# config/settings.yaml.
cli:
  agents:
    ashigaru1: &vllm_worker
      type: codex
      model: vllm-worker
      env:
        VLLM_BASE_URL:
          from_env: VLLM_BASE_URL
        VLLM_MODEL_ID:
          from_env: VLLM_MODEL_ID
        VLLM_API_KEY:
          from_env: VLLM_API_KEY
          required: true
    ashigaru2: &vllm_worker_2
      type: codex
      model: vllm-worker
      env:
        # Second server (GPU 1).  Falls back to the first when unset.
        VLLM_BASE_URL:
          from_env: VLLM_BASE_URL_2
          fallback_env: VLLM_BASE_URL
        VLLM_MODEL_ID:
          from_env: VLLM_MODEL_ID
        VLLM_API_KEY:
          from_env: VLLM_API_KEY
          required: true
    ashigaru3: *vllm_worker
    ashigaru4: *vllm_worker_2
    ashigaru5: *vllm_worker
    ashigaru6: *vllm_worker_2
    ashigaru7: *vllm_worker
    ashigaru8: *vllm_worker_2
    ashigaru9: *vllm_worker
    ashigaru10: *vllm_worker_2
    tanya: *vllm_worker
    tanya2: *vllm_worker_2
    # QC runs on the Codex subscription, not on vLLM: Metsuke is the last gate
    # before a commit and needs a model that reads a diff as well as Opus does.
    metsuke:
      type: codex
      model: gpt-6.1-sol
      effort: medium
# vLLM is free; with two servers (VLLM_BASE_URL on GPU 0, VLLM_BASE_URL_2 on
# GPU 1) this formation runs ten Ashigaru and two Tanya, each pinned to one
# server, in a 4x4 grid.  The Claude formation (no profile) stays at three and one.
formation:
  ashigaru_count: 10
