# Role allocation for an OpenAI Codex formation.
# This is merged over the local config/settings.yaml at launch.
cli:
  default: codex
  agents:
    shogun:
      type: codex
      model: gpt-6-luna
      effort: low
    karo:
      type: codex
      model: gpt-6-sol
      effort: medium
    gunshi:
      type: codex
      model: gpt-6-astra
      effort: medium
    ashigaru1: {type: codex, model: gpt-6-luna, effort: medium}
    ashigaru2: {type: codex, model: gpt-6-luna, effort: medium}
    ashigaru3: {type: codex, model: gpt-6-luna, effort: medium}
formation:
  ashigaru_count: 3
