# Role allocation for a Claude Code formation.
# This is merged over the local config/settings.yaml at launch.
cli:
  default: claude
  agents:
    shogun:
      type: claude
      model: claude-sonnet-5
      effort: medium
    karo:
      type: claude
      model: claude-opus-5-5
      effort: medium
    gunshi:
      type: claude
      model: claude-fable-5-1
      effort: high
    ashigaru1: {type: claude, model: claude-sonnet-5, effort: medium}
    ashigaru2: {type: claude, model: claude-sonnet-5, effort: medium}
    ashigaru3: {type: claude, model: claude-sonnet-5, effort: medium}
    ashigaru4: {type: claude, model: claude-sonnet-5, effort: medium}
    ashigaru5: {type: claude, model: claude-sonnet-5, effort: medium}
    ashigaru6: {type: claude, model: claude-sonnet-5, effort: medium}
    ashigaru7: {type: claude, model: claude-sonnet-5, effort: medium}
